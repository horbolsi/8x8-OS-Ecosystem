<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020308">
<title>8x8 OS · Fabric Mirror v0.1.0</title>
<style>html,body{margin:0;min-height:100%;background:#020308;color:#eef9ff;font-family:system-ui,-apple-system,sans-serif}main{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}b{font-size:32px}p{color:#8da6b7;max-width:620px;line-height:1.6}.spin{width:42px;height:42px;margin:0 auto 18px;border:2px solid #17344a;border-top-color:#70e8ff;border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}noscript{display:block;padding:30px}</style>
</head>
<body>
<main id="boot"><div><div class="spin"></div><b>8×8 OS</b><p>Opening the canonical Fabric Mirror v0.1.0…</p></div></main>
<noscript>JavaScript is required for this public beta projection.</noscript>
<script>
(async()=>{const exact='https://raw.githubusercontent.com/8x8org/8x8-user-edition/af620b04be9503bee0348c91911757d3a65297cc/index.html';try{const r=await fetch(exact,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const html=await r.text();if(!/^<!doctype html>/i.test(html.trim()))throw new Error('non-html canonical payload');document.open('text/html','replace');document.write(html);document.close()}catch(e){document.getElementById('boot').innerHTML='<div><b>8×8 OS</b><p>Canonical Fabric Mirror failed to hydrate. Deployment remains fail-closed rather than serving source code.</p><p style="color:#ff7f93">'+String(e.message).replace(/[<>]/g,'')+'</p></div>'}})();
</script>
</body>
</html>
