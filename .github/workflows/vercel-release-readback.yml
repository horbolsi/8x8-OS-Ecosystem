name: Vercel Release Readback

on:
  pull_request:
    paths:
      - release-identity.json
      - scripts/verify_vercel_release_readback.py
      - .github/workflows/vercel-release-readback.yml
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: Exact Vercel deployment or production alias to verify
        required: true
        type: string
      environment:
        description: Preview or Production
        required: true
        default: Preview
        type: choice
        options:
          - Preview
          - Production

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release identity and verifier syntax
        run: |
          python3 -m json.tool release-identity.json >/dev/null
          python3 -m py_compile scripts/verify_vercel_release_readback.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('release-identity.json').read_text())
          assert p['schema'] == '8x8.vercel-release-identity.v1'
          assert p['canonical_root'] == 'fabric://8x8/core'
          assert p['expected_root_markers']
          assert p['promotion_law']['ready_is_deployed'] is False
          assert p['promotion_law']['preview_is_production'] is False
          print('RELEASE_IDENTITY_CONTRACT=PASS')
          PY

  deployment-readback:
    if: >-
      github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment_url != ''
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact deployed SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - name: Verify exact deployment body identity
        env:
          BASE_URL: ${{ github.event.deployment_status.environment_url }}
          ENVIRONMENT_NAME: ${{ github.event.deployment.environment }}
          DEPLOYED_SHA: ${{ github.event.deployment.sha }}
        run: |
          echo "DEPLOYED_SHA=$DEPLOYED_SHA"
          echo "DEPLOYMENT_ENVIRONMENT=$ENVIRONMENT_NAME"
          python3 scripts/verify_vercel_release_readback.py \
            --base-url "$BASE_URL" \
            --environment "$ENVIRONMENT_NAME"
      - name: Verify canonical production alias when configured
        if: >-
          github.event.deployment.environment == 'Production' &&
          vars.PUBLIC_PRODUCTION_URL != ''
        env:
          PUBLIC_PRODUCTION_URL: ${{ vars.PUBLIC_PRODUCTION_URL }}
        run: |
          python3 scripts/verify_vercel_release_readback.py \
            --base-url "$PUBLIC_PRODUCTION_URL" \
            --environment Production

  manual-readback:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify requested carrier
        run: |
          python3 scripts/verify_vercel_release_readback.py \
            --base-url '${{ inputs.base_url }}' \
            --environment '${{ inputs.environment }}'
