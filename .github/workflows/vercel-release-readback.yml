name: Vercel Release Readback

on:
  pull_request:
    paths:
      - index.html
      - stable/**
      - r4/**
      - r5/**
      - ssi/**
      - telegram/**
      - vercel.json
      - release-identity.json
      - telegram-release-identity.json
      - scripts/verify_vercel_release_readback.py
      - scripts/verify_ssi_preview_readback.py
      - tests/**
      - .github/workflows/vercel-release-readback.yml
  push:
    branches:
      - main
    paths:
      - index.html
      - stable/**
      - r4/**
      - r5/**
      - ssi/**
      - telegram/**
      - vercel.json
      - release-identity.json
      - telegram-release-identity.json
      - scripts/verify_vercel_release_readback.py
      - scripts/verify_ssi_preview_readback.py
      - tests/**
      - .github/workflows/vercel-release-readback.yml
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: Exact Vercel deployment or canonical production domain to verify
        required: true
        type: string
      environment:
        description: Preview or Production
        required: true
        default: Preview
        type: choice
        options:
          - Preview
          - Production

permissions:
  contents: read
  deployments: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  contract:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release identity, physical carrier, routing, rollback and Telegram contracts
        run: |
          python3 -m json.tool release-identity.json >/dev/null
          python3 -m json.tool vercel.json >/dev/null
          if [ -f telegram-release-identity.json ]; then python3 -m json.tool telegram-release-identity.json >/dev/null; fi
          python3 -m py_compile scripts/verify_vercel_release_readback.py scripts/verify_ssi_preview_readback.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          from urllib.parse import urlparse

          identity = json.loads(Path('release-identity.json').read_text())
          vercel = json.loads(Path('vercel.json').read_text())

          assert identity['schema'] == '8x8.vercel-release-identity.v1'
          assert identity['canonical_root'] == 'fabric://8x8/core'
          assert identity['expected_root_markers']
          carrier_path = identity['carrier_path'].lstrip('/')
          assert carrier_path
          assert identity['promotion_law']['ready_is_deployed'] is False
          assert identity['promotion_law']['preview_is_production'] is False
          assert identity['promotion_law']['production_requires_body_readback'] is True
          assert identity['promotion_law']['production_requires_release_identity_match'] is True
          assert identity['promotion_law']['production_requires_physical_root_carrier'] is True
          assert identity['rollback_routes']
          assert identity['rollback_carrier_blob_sha']

          public_url = identity['public_production_url']
          parsed = urlparse(public_url)
          assert parsed.scheme == 'https'
          assert parsed.hostname
          assert not parsed.path.rstrip('/')

          def git_blob(path: str) -> str:
              p = Path(path)
              assert p.is_file(), p
              return subprocess.check_output(['git', 'hash-object', str(p)], text=True).strip()

          carrier_blob = git_blob(carrier_path)
          assert carrier_blob == identity['carrier_blob_sha'], (carrier_blob, identity['carrier_blob_sha'])

          route_files = {
              '/r6': 'r6/index.html',
              '/r5': 'r5/index.html',
              '/r4': 'r4/index.html',
              '/r3': 'r3/index.html',
          }
          rollback_blobs = identity['rollback_carrier_blob_sha']
          expected_rollbacks = identity.get('rollback_expected_markers', {})
          for route in identity['rollback_routes']:
              assert route in route_files, route
              observed = git_blob(route_files[route])
              assert observed == rollback_blobs[route], (route, observed, rollback_blobs[route])
              assert observed != carrier_blob
              assert route in expected_rollbacks and expected_rollbacks[route]

          rewrites = {row['source']: row['destination'] for row in vercel.get('rewrites', [])}
          carrier_destination = '/' + carrier_path
          assert rewrites['/_8x8/release'] == '/release-identity.json'
          assert rewrites['/'] == carrier_destination
          assert rewrites['/world'] == carrier_destination
          assert rewrites['/stable'] == carrier_destination
          assert rewrites['/ssi'] == '/ssi/index.html'
          assert rewrites['/ssi/'] == '/ssi/index.html'
          for route in identity['rollback_routes']:
              assert rewrites[route] == '/' + route_files[route]

          release_headers = {}
          for rule in vercel.get('headers', []):
              if rule.get('source') == '/(.*)':
                  for header in rule.get('headers', []):
                      release_headers[header['key'].lower()] = header['value']
          assert release_headers['x-8x8-release-identity'] == identity['release_id']
          assert release_headers['x-8x8-public-private-boundary'] == 'PUBLIC-SHELL-NO-PRIVATE-RUNTIME'

          ssi_headers = {}
          for rule in vercel.get('headers', []):
              if rule.get('source') == '/ssi(.*)':
                  for header in rule.get('headers', []):
                      ssi_headers[header['key'].lower()] = header['value']
          assert ssi_headers['x-8x8-preview-identity'] == 'SSI-R5.1-VISION-CONVERGENCE'
          assert ssi_headers['x-8x8-release-channel'] == 'preview'
          assert ssi_headers['x-8x8-production-promotion'] == 'false'
          assert 'no-store' in ssi_headers['cache-control'].lower()
          assert 'noindex' in ssi_headers['x-robots-tag'].lower()

          telegram_identity_path = Path('telegram-release-identity.json')
          if telegram_identity_path.exists():
              telegram = json.loads(telegram_identity_path.read_text())
              assert telegram['schema'] == '8x8.telegram-miniapp-release.v1'
              assert telegram['canonical_root'] == 'fabric://8x8/core'
              assert telegram['route'] == '/telegram'
              assert telegram['bot'] == 'app8x8org_bot'
              assert telegram['telegram_identity_authority'] == 'NONE_IN_STATIC_BETA'
              assert telegram['owner_8080_exposed'] is False
              assert telegram['owner_8087_exposed'] is False
              assert telegram['raw_credentials_in_browser_bundle'] is False
              assert telegram['financial_effect'] is False
              assert telegram['signing'] is False
              assert telegram['mainnet'] is False
              assert telegram['mint'] is False
              assert telegram['payment'] is False
              assert rewrites['/_8x8/telegram-release'] == '/telegram-release-identity.json'
              assert rewrites['/telegram'] == '/telegram/index.html'
              assert rewrites['/telegram/'] == '/telegram/index.html'

              expected_blobs = telegram['active_git_blobs']
              for path, expected in expected_blobs.items():
                  assert git_blob(path) == expected, (path, git_blob(path), expected)

              telegram_headers = {}
              for rule in vercel.get('headers', []):
                  if rule.get('source') == '/telegram(.*)':
                      for header in rule.get('headers', []):
                          telegram_headers[header['key'].lower()] = header['value']
              assert telegram_headers['x-8x8-telegram-mini-app'] == 'true'
              assert telegram_headers['x-8x8-release-channel'] == 'public-telegram-beta'
              assert telegram_headers['x-8x8-backend-authority'] == 'NONE-STATIC-ONLY'
              assert telegram_headers['x-8x8-public-private-boundary'] == 'PUBLIC-SHELL-NO-OWNER-RUNTIME'
              assert telegram_headers['x-8x8-financial-sale-open'] == 'false'
              assert telegram_headers['x-8x8-mainnet-live'] == 'false'
              assert 'no-store' in telegram_headers['cache-control'].lower()
              assert 'noindex' in telegram_headers['x-robots-tag'].lower()
              print('TELEGRAM_MINIAPP_SOURCE_CONTRACT=PASS')

          print('RELEASE_IDENTITY_CONTRACT=PASS')
          print('PUBLIC_PRODUCTION_URL=PASS', public_url)
          print('PHYSICAL_ROOT_CARRIER_BLOB=PASS', carrier_blob)
          print('VERCEL_ROUTING_CONTRACT=PASS')
          print('ROLLBACK_BLOB_CONTRACT=PASS')
          print('ROLLBACK_MARKER_CONTRACT=PASS')
          PY

  deployment-readback:
    if: >-
      github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment_url != ''
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact deployed SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}

      - name: Probe generated deployment URL
        env:
          GENERATED_URL: ${{ github.event.deployment_status.environment_url }}
          ENVIRONMENT_NAME: ${{ github.event.deployment.environment }}
          DEPLOYED_SHA: ${{ github.event.deployment.sha }}
        run: |
          echo "DEPLOYED_SHA=$DEPLOYED_SHA"
          echo "DEPLOYMENT_ENVIRONMENT=$ENVIRONMENT_NAME"
          python3 scripts/verify_vercel_release_readback.py \
            --base-url "$GENERATED_URL" \
            --environment "$ENVIRONMENT_NAME" \
            --allow-auth-gated

      - name: Fetch authoritative deployment attestation
        if: github.event.deployment.environment != 'Production'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ github.event.deployment.id }}
          DEPLOYMENT_STATUS_ID: ${{ github.event.deployment_status.id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID" \
            > "$RUNNER_TEMP/ssi-deployment.json"
          gh api "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses/$DEPLOYMENT_STATUS_ID" \
            > "$RUNNER_TEMP/ssi-deployment-status.json"

      - name: Verify exact SSI preview body and fail-closed headers
        if: github.event.deployment.environment != 'Production'
        env:
          GENERATED_URL: ${{ github.event.deployment_status.environment_url }}
          ENVIRONMENT_NAME: ${{ github.event.deployment.environment }}
          DEPLOYED_SHA: ${{ github.event.deployment.sha }}
          SSI_PREVIEW_ACCESS_MODE: ${{ vars.SSI_PREVIEW_ACCESS_MODE }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          ACCESS_MODE="${SSI_PREVIEW_ACCESS_MODE:-protected-approved-bypass}"
          if [ "$ACCESS_MODE" != "public" ] && [ "$ACCESS_MODE" != "protected-approved-bypass" ]; then
            echo "::error::SSI_PREVIEW_ACCESS_MODE must be public or protected-approved-bypass"
            exit 1
          fi
          if [ "$ACCESS_MODE" = "protected-approved-bypass" ] && [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "::error::SSI_PROTECTED_READBACK=BLOCKED_BYPASS_SECRET_NOT_CONFIGURED"
            echo "SSI_PUBLIC_PREVIEW_ACCEPTANCE=FALSE_PROTECTED"
            exit 1
          fi
          python3 scripts/verify_ssi_preview_readback.py \
            --base-url "$GENERATED_URL" \
            --deployed-sha "$DEPLOYED_SHA" \
            --deployment-record "$RUNNER_TEMP/ssi-deployment.json" \
            --deployment-status-record "$RUNNER_TEMP/ssi-deployment-status.json" \
            --environment "$ENVIRONMENT_NAME" \
            --access-mode "$ACCESS_MODE" \
            --expected-body ssi/index.html

      - name: Verify canonical public production domain
        if: github.event.deployment.environment == 'Production'
        env:
          PUBLIC_PRODUCTION_URL_OVERRIDE: ${{ vars.PUBLIC_PRODUCTION_URL }}
        run: |
          PUBLIC_PRODUCTION_URL="$PUBLIC_PRODUCTION_URL_OVERRIDE"
          if [ -z "$PUBLIC_PRODUCTION_URL" ]; then
            PUBLIC_PRODUCTION_URL="$(python3 - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('release-identity.json').read_text())['public_production_url'])
          PY
          )"
          fi
          if [ -z "$PUBLIC_PRODUCTION_URL" ]; then
            echo "::error::No canonical public production URL is configured"
            exit 1
          fi
          echo "PUBLIC_PRODUCTION_URL=$PUBLIC_PRODUCTION_URL"
          python3 scripts/verify_vercel_release_readback.py \
            --base-url "$PUBLIC_PRODUCTION_URL" \
            --environment Production

  manual-readback:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify requested carrier
        env:
          BASE_URL: ${{ inputs.base_url }}
          REQUESTED_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          python3 scripts/verify_vercel_release_readback.py \
            --base-url "$BASE_URL" \
            --environment "$REQUESTED_ENVIRONMENT"
          echo "SSI_EXACT_MANUAL_READBACK=NOT_RUN_WITHOUT_AUTHORITATIVE_DEPLOYMENT_RECORD"
