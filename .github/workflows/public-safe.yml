name: Public Safe Companion

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Reject credentials and fake sensitive success paths
        run: |
          set -euo pipefail
          if git grep -nE '8x8\.FlashTM8\.|flashtm8-admin-|[0-9]{8,12}:[A-Za-z0-9_-]{30,}|gh[pousr]_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9_-]{20,}|0x[0-9a-fA-F]{64}([^0-9a-fA-F]|$)' -- '*.js' '*.ts' '*.json' '*.md'; then
            echo 'Credential-like value detected in public companion.' >&2
            exit 1
          fi
          if git grep -nE 'process\.env\.(ADMIN_SECRET|BOT_TOKEN|TELEGRAM_BOT_TOKEN|DATABASE_URL)[[:space:]]*\|\|[[:space:]]*["'"'][^"'"']+["'"']' -- '*.js' '*.ts'; then
            echo 'Credential fallback detected in public companion.' >&2
            exit 1
          fi
          if git grep -nE 'res\.json\([^\n]*(txHash|transactionHash)[^\n]*(confirmed|success)' -- '*.js' '*.ts'; then
            echo 'Route appears to claim successful sensitive execution.' >&2
            exit 1
          fi
      - name: Start compatibility server
        env:
          HUB_PORT: "3300"
          ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:8086"
        run: |
          npm start >/tmp/8x8-companion.log 2>&1 &
          echo $! >/tmp/8x8-companion.pid
      - name: Wait for health
        run: |
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3300/api/health >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/8x8-companion.log
          exit 1
      - name: Verify gates and no side effects
        env:
          BASE_URL: http://127.0.0.1:3300
        run: bash scripts/public_safe_smoke_test.sh
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/8x8-companion.log || true
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/8x8-companion.pid)" 2>/dev/null || true
