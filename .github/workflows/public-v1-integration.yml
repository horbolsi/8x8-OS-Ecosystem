name: Public 8x8 V1 Integration

on:
  pull_request:
    paths:
      - 'public/**'
      - 'docs/PUBLIC_8X8_V1_SCOPE.md'
      - 'package.json'
      - 'test/estate-registry-smoke.mjs'
      - '.github/workflows/public-v1-integration.yml'
  push:
    branches:
      - integration/public-8x8-v1
    paths:
      - 'public/**'
      - 'docs/PUBLIC_8X8_V1_SCOPE.md'
      - 'package.json'
      - 'test/estate-registry-smoke.mjs'
      - '.github/workflows/public-v1-integration.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact submitted source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install declared dependencies without scripts
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate estate registry
        run: node test/estate-registry-smoke.mjs

      - name: Validate public application contracts
        run: npm test

      - name: Validate JSON documents
        run: |
          python3 -m json.tool public/estate-registry.json >/dev/null
          python3 -m json.tool public/product-map.json >/dev/null
          python3 -m json.tool public/future-lab/state.json >/dev/null

      - name: Reject withdrawn private projections
        shell: bash
        run: |
          set -Eeuo pipefail
          test ! -e public/capabilities
          test ! -e public/legacy-dashboard
          test ! -e test/capabilities-observatory-smoke.mjs

      - name: Public information boundary scan
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -RInE '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|authorization:[[:space:]]*bearer|gh[opsu]_|github_pat_|sk-[A-Za-z0-9_-]{20,}|/root/|/data/data/|\.ssh/|\.hermes|state\.db|wallet seed|mnemonic|\bTermux\b|Ubuntu[[:space:]]+PRoot|Samsung[[:space:]]+Galaxy|horbolsi/8x8-os-june2026|\bHermes\b|\bdpl_[A-Za-z0-9]{16,}\b)' public docs/PUBLIC_8X8_V1_SCOPE.md package.json; then
            echo 'Public information boundary violation'
            exit 1
          fi

      - name: Truth-label checks
        run: |
          grep -q 'PUBLIC_SAFE_REGISTRY_NOT_PRIVATE_RUNTIME_TELEMETRY' public/estate-registry.json
          grep -q 'WHOLE_SYSTEM_COMPLETE' public/estate-registry.json
          grep -q 'Private Owner Boundary' docs/PUBLIC_8X8_V1_SCOPE.md
          grep -q 'Detailed candidate research remains private' public/index.html
