name: Economy Fail-Close Contract

on:
  pull_request:
    paths:
      - "server/index.js"
      - "server/index.ts"
      - "routes/ai.ts"
      - "tests/economy_failclose.test.js"
      - "package.json"
      - ".github/workflows/economy-failclose.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: economy-failclose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install runtime dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run fail-closed HTTP contract
        run: npm test
