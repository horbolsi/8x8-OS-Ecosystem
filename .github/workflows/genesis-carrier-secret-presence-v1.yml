name: Genesis Carrier Secret Presence V1

on:
  push:
    branches:
      - ops/genesis-carrier-secret-presence-v1-20260819
    paths:
      - .github/workflows/genesis-carrier-secret-presence-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  presence-only:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN_VALUE: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ACCESS_TOKEN_VALUE: ${{ secrets.VERCEL_ACCESS_TOKEN }}
      DATABASE_URL_VALUE: ${{ secrets.DATABASE_URL }}
      NEON_DATABASE_URL_VALUE: ${{ secrets.NEON_DATABASE_URL }}
      POSTGRES_URL_VALUE: ${{ secrets.POSTGRES_URL }}
      EIGHTX8_NEON_DATABASE_URL_VALUE: ${{ secrets.EIGHTX8_NEON_DATABASE_URL }}
      NEON_8X8_HUB_DATABASE_URL_VALUE: ${{ secrets.NEON_8X8_HUB_DATABASE_URL }}
    steps:
      - name: Emit presence booleans only
        shell: bash
        run: |
          set -euo pipefail
          present(){ if [ -n "${!1:-}" ]; then printf '%s=true\n' "$2"; else printf '%s=false\n' "$2"; fi; }
          present VERCEL_TOKEN_VALUE HAS_VERCEL_TOKEN
          present VERCEL_ACCESS_TOKEN_VALUE HAS_VERCEL_ACCESS_TOKEN
          present DATABASE_URL_VALUE HAS_DATABASE_URL
          present NEON_DATABASE_URL_VALUE HAS_NEON_DATABASE_URL
          present POSTGRES_URL_VALUE HAS_POSTGRES_URL
          present EIGHTX8_NEON_DATABASE_URL_VALUE HAS_EIGHTX8_NEON_DATABASE_URL
          present NEON_8X8_HUB_DATABASE_URL_VALUE HAS_NEON_8X8_HUB_DATABASE_URL
          echo RAW_SECRET_VALUE_PRINTED=false
          echo SECRET_MUTATION=false
          echo VERCEL_MUTATION=false
          echo DATABASE_MUTATION=false
